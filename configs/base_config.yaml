# =========================================================
# AttentiveDroneNet - Base Configuration
# Change values here to run new experiments WITHOUT
# touching any model/training code.
# =========================================================

model:
  backbone:
    num_stages: 4                    # how many conv stages in backbone
    filters: [64, 128, 256, 512]     # channels per stage
    kernel_size: 3
    activation: silu                 # silu | relu | leaky_relu

  attention:
    use_spatial: true
    use_channel: true
    reduction_ratio: 16              # channel attention squeeze ratio

  neck:
    num_scales: 3                    # small/medium/large object scales
    fusion_channels: 256

  head:
    num_classes: 1                   # 1 = drone only
    anchor_free: true

training:
  learning_rate: 0.001
  weight_decay: 0.0005
  batch_size: 16
  epochs: 100
  optimizer: adamw                   # adamw | sgd | adam
  scheduler: cosine                  # cosine | step | none
  early_stopping_patience: 15
  gradient_clip: 5.0

  loss:
    classification: focal            # focal | bce
    localization: ciou               # ciou | iou | giou
    focal_alpha: 0.25
    focal_gamma: 2.0
    box_loss_weight: 5.0
    cls_loss_weight: 1.0

data:
  input_size: 640
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augmentation: true
  mosaic: true
  horizontal_flip: 0.5

experiment:
  name: "exp_001_baseline"
  seed: 42
  device: "cuda"                     # cuda | cpu
  save_dir: "checkpoints/"
  log_dir: "experiments/"
